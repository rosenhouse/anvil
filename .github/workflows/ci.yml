name: Continuous integration
run-name: Continuous integration run by ${{ github.actor }}
on:
  push:
    branches:
      - gabe/sync-controller
  pull_request:
  merge_group:
  workflow_dispatch:
# One run per branch: a new push supersedes the run of the previous head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  kind_version: 0.23.0
  go_version: "^1.20"

jobs:
  setup-toolchain:
    runs-on: ubuntu-24.04
    outputs:
      verus-sha: ${{ steps.verus-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned Verus commit SHA
        id: verus-sha
        run: |
          SHA="$(cat verus.sha)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building Verus $SHA (pinned in verus.sha)"
      - name: Cache toolchain + Verus build
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ steps.verus-sha.outputs.sha }}
      - name: Install Rust + build Verus if cache is missing
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" \
            | sh -s -- --default-toolchain none -y
          . "$HOME/.cargo/env"
          VERUS_DIR="$HOME/verus" ./tools/setup-verus.sh

  full-verification:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    # A full `cargo verus verify --lib` is about an hour on this runner
    # (build.md). Ninety minutes leaves room for a slow runner and still fails
    # in a bounded time instead of holding a runner for the six-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Build the library with plain cargo
        run: |
          . "$HOME/.cargo/env"
          cargo build --lib
      - name: Run the unit tests (executable model, exec wrappers)
        run: |
          . "$HOME/.cargo/env"
          cargo test --lib
      - name: Run the boot-check tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --features dyn-runtime --bin widget_sync_controller
      - name: Verify the library
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          cargo verus verify --lib

  vreplicaset-admission-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vreplicaset admission controller
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vreplicaset-admission --build
      - name: Run vreplicaset e2e tests for admission
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- vreplicaset-admission

  vdeployment-admission-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vdeployment admission controller
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vdeployment-admission --build
      - name: Run vdeployment e2e tests for admission
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- vdeployment-admission

  vreplicaset-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vreplicaset controller
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vreplicaset --build
      - name: Run vreplicaset e2e tests
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- vreplicaset

  vdeployment-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vdeployment controller
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vdeployment --build
      - name: Run vdeployment e2e tests
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- vdeployment

  vstatefulset-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vstatefulset controller
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vstatefulset --build
      - name: Run vstatefulset e2e tests
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- vstatefulset

  rabbitmq-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy rabbitmq controller
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh rabbitmq --build
      - name: Run rabbitmq e2e tests
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- rabbitmq

  widget-sync-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Check widget sync exec hygiene
        run: ./tools/check-widget-exec-hygiene.sh
      - name: Deploy widget sync controller across three kind clusters
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/two-cluster-test.sh --build
      - name: Run widget sync e2e tests
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- widget-sync
      - name: Run widget sync e2e tests for the configured kinds
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- widget-sync-kinds
      - name: Run widget sync bindings e2e tests
        run: . "$HOME/.cargo/env" && cd e2e && cargo run -- widget-sync-bindings
      - name: Collect controller logs
        if: failure()
        run: |
          echo "::group::sync controller (outer)"
          kubectl --context kind-widget-sync-outer -n widget-sync logs deployment/widget-sync-controller --tail=400 || true
          kubectl --context kind-widget-sync-outer -n widget-sync describe pod -l app.kubernetes.io/name=widget-sync-controller || true
          echo "::endgroup::"
          for cluster in a b; do
            echo "::group::echo controller (inner-$cluster)"
            kubectl --context "kind-widget-sync-inner-$cluster" -n widget-echo logs deployment/widget-echo-controller --tail=200 || true
            echo "::endgroup::"
          done
          echo "::group::bindings"
          kubectl --context kind-widget-sync-outer get secrets -A -o name | grep -- -kubeconfig || true
          for cluster in a b; do
            kubectl --context "kind-widget-sync-inner-$cluster" -n kube-system get configmap anvil-sync-claim -o yaml || true
          done
          echo "::endgroup::"
          echo "::group::widgets"
          kubectl --context kind-widget-sync-outer get widgets -A -o yaml || true
          for cluster in a b; do
            kubectl --context "kind-widget-sync-inner-$cluster" get widgets -A -o yaml || true
          done
          echo "::endgroup::"
          echo "::group::gadgets"
          kubectl --context kind-widget-sync-outer get gadgets -A -o yaml || true
          for cluster in a b; do
            kubectl --context "kind-widget-sync-inner-$cluster" get gadgets -A -o yaml || true
          done
          echo "::endgroup::"

  # Aggregates every other job into a single status, so branch protection can
  # require one check instead of being updated whenever a job is added, renamed
  # or removed. `if: always()` makes it report even when a dependency fails, is
  # cancelled or is skipped; the step below turns any of those into a failure.
  all-checks-pass:
    needs:
      - setup-toolchain
      - full-verification
      - vreplicaset-admission-e2e-test
      - vdeployment-admission-e2e-test
      - vreplicaset-e2e-test
      - vdeployment-e2e-test
      - vstatefulset-e2e-test
      - rabbitmq-e2e-test
      - widget-sync-e2e-test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "At least one job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
