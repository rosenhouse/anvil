        with:
          path: .ci-cache/rabbitmq-e2e-test.ok
          key: rabbitmq-e2e-test-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'e2e/**', 'docker/**', 'deploy/**', 'tools/local-test.sh', 'tools/deploy.sh') }}
      - name: Setup Go
