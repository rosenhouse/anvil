          key: vstatefulset-e2e-test-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'e2e/**', 'docker/**', 'deploy/**', 'tools/local-test.sh', 'tools/deploy.sh') }}
      - name: Setup Go
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
