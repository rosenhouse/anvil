name: Continuous integration
run-name: Continuous integration run by ${{ github.actor }}
on:
  push:
    branches:
      - gabe/sync-controller
  pull_request:
  merge_group:
  workflow_dispatch:
env:
  kind_version: 0.23.0
  go_version: "^1.20"

jobs:
  setup-toolchain:
    runs-on: ubuntu-24.04
    outputs:
      verus-sha: ${{ steps.verus-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Get latest Verus main commit SHA
        id: verus-sha
        run: |
          SHA="$(git ls-remote https://github.com/verus-lang/verus main | cut -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building Verus main@$SHA"
      - name: Cache toolchain + Verus build
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ steps.verus-sha.outputs.sha }}
      - name: Install Rust + build Verus if cache is missing
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" \
            | sh -s -- --default-toolchain none -y
          . "$HOME/.cargo/env"
          VERUS_DIR="$HOME/verus" ./tools/setup-verus.sh

  full-verification:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      # Verification only depends on the library sources and the Verus build
      # they're checked against, so a successful run is memoized under a key
      # covering exactly that. When neither has changed since the last green
      # run, the cache hits and the (slow) verify step below is skipped.
      - name: Check for a previous successful verification of this source
        id: verify-cache
        uses: actions/cache@v6
        with:
          path: .ci-cache/full-verification.ok
          key: full-verification-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify all controllers
        if: steps.verify-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          cargo verus verify --lib
          mkdir -p .ci-cache && touch .ci-cache/full-verification.ok

  vreplicaset-admission-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      # Memoize a green run under a key covering everything that can change
      # its outcome: the controller/e2e sources, the deploy tooling, and the
      # Verus build they run against. Unchanged since the last green run ->
      # skip the build/deploy/test steps below.
      - name: Check for a previous successful e2e run of this source
        id: e2e-cache
        uses: actions/cache@v6
        with:
          path: .ci-cache/vreplicaset-admission-e2e-test.ok
          key: vreplicaset-admission-e2e-test-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'e2e/**', 'docker/**', 'deploy/**', 'tools/local-test.sh', 'tools/deploy.sh') }}
      - name: Setup Go
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vreplicaset admission controller
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vreplicaset-admission --build
      - name: Run vreplicaset e2e tests for admission
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env" && cd e2e && cargo run -- vreplicaset-admission
          mkdir -p ../.ci-cache && touch ../.ci-cache/vreplicaset-admission-e2e-test.ok

  vdeployment-admission-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Check for a previous successful e2e run of this source
        id: e2e-cache
        uses: actions/cache@v6
        with:
          path: .ci-cache/vdeployment-admission-e2e-test.ok
          key: vdeployment-admission-e2e-test-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'e2e/**', 'docker/**', 'deploy/**', 'tools/local-test.sh', 'tools/deploy.sh') }}
      - name: Setup Go
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vdeployment admission controller
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vdeployment-admission --build
      - name: Run vdeployment e2e tests for admission
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env" && cd e2e && cargo run -- vdeployment-admission
          mkdir -p ../.ci-cache && touch ../.ci-cache/vdeployment-admission-e2e-test.ok

  vreplicaset-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Check for a previous successful e2e run of this source
        id: e2e-cache
        uses: actions/cache@v6
        with:
          path: .ci-cache/vreplicaset-e2e-test.ok
          key: vreplicaset-e2e-test-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'e2e/**', 'docker/**', 'deploy/**', 'tools/local-test.sh', 'tools/deploy.sh') }}
      - name: Setup Go
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vreplicaset controller
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env"
          export PATH="$PATH:$HOME/verus/source/target-verus/release"
          ./tools/local-test.sh vreplicaset --build
      - name: Run vreplicaset e2e tests
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
          . "$HOME/.cargo/env" && cd e2e && cargo run -- vreplicaset
          mkdir -p ../.ci-cache && touch ../.ci-cache/vreplicaset-e2e-test.ok

  vdeployment-e2e-test:
    needs: setup-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/verus
            rust-toolchain.toml
            target
          key: toolchain-${{ runner.os }}-${{ needs.setup-toolchain.outputs.verus-sha }}
      - name: Check for a previous successful e2e run of this source
        id: e2e-cache
        uses: actions/cache@v6
        with:
          path: .ci-cache/vdeployment-e2e-test.ok
          key: vdeployment-e2e-test-${{ needs.setup-toolchain.outputs.verus-sha }}-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'e2e/**', 'docker/**', 'deploy/**', 'tools/local-test.sh', 'tools/deploy.sh') }}
      - name: Setup Go
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go_version }}
          cache: false
      - name: Install kind
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: go install sigs.k8s.io/kind@v$kind_version
      - name: Deploy vdeployment controller
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: |
