# The widget sync controller, deployed in the outer (primary) cluster.
# Exactly one replica: the proofs assume a single active sync controller.
# No kubeconfig is mounted: the controller reads the credential of each binding
# from the Secret `<clusterName>-kubeconfig` of the binding's namespace through
# the API server (rbac.yaml grants secrets get, list and watch), so bindings come
# and go, and their credentials rotate, without touching this Deployment.
# Readiness is the file the binary creates at $READY_FILE once its configured
# kinds have passed the boot checks and the sync controllers are running. It
# says nothing about the bindings on purpose: an inner cluster that is down or
# that refuses the credential is one binding among many, degraded and retried,
# and must not keep the pod from becoming ready. There is no liveness probe:
# the binary exposes nothing that reflects whether the reconcilers are still
# making progress, and a probe that does not measure that would only restart a
# healthy pod.
#
# The ConfigMap widget-sync-janitor is the janitor's pause gate. It is mounted
# read-only at /etc/widget-sync/janitor and the binary is told, through
# JANITOR_PAUSE_FILE, to withhold every Delete while the file `pause` exists
# there. It ships empty, so the mount exists and nothing is paused; adding the
# key `pause` (any content) pauses within the kubelet's ConfigMap sync period,
# removing it resumes. See "Before restoring the outer cluster" in README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: widget-sync-janitor
  namespace: widget-sync
  labels:
    app.kubernetes.io/name: widget-sync-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-sync-controller
  namespace: widget-sync
  labels:
    app.kubernetes.io/name: widget-sync-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: widget-sync-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widget-sync-controller
    spec:
      # The in-cluster token is how the controller reaches the outer API server.
      automountServiceAccountToken: true
      # The image declares the same uid; it is repeated here so that
      # runAsNonRoot holds even for an image built without it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: local/widget-sync-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          name: controller
          # The image's entrypoint is `controller run`; these follow it. One
          # --kind per kind the controller takes on, each with the field that
          # names an object's cluster: Widget's is spec.clusterName (a required,
          # immutable string), Gadget's is its own metadata.name. Adding a kind
          # here means its CRD in both clusters and its rules in rbac.yaml and
          # rbac_inner.yaml; a CRD without the shape of the design's section 2.2
          # is refused at boot and the pod never becomes ready.
          args:
            - --kind
            - anvil.dev/v1/Widget:field:spec.clusterName
            - --kind
            - anvil.dev/v1/Gadget:name
          env:
            - name: READY_FILE
              value: /run/widget-sync/ready
            - name: JANITOR_PAUSE_FILE
              value: /etc/widget-sync/janitor/pause
          # A startup probe, not a readiness probe: the file appears once the
          # boot checks have passed and never disappears, so there is nothing
          # to re-check afterwards.
          startupProbe:
            exec:
              command:
                - test
                - -f
                - /run/widget-sync/ready
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The janitor's pause gate: the file `pause` here withholds deletes.
            - name: janitor
              mountPath: /etc/widget-sync/janitor
              readOnly: true
            # The only writable path; it holds the ready file.
            - name: run
              mountPath: /run/widget-sync
      volumes:
        - name: janitor
          configMap:
            name: widget-sync-janitor
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      serviceAccountName: widget-sync-controller
