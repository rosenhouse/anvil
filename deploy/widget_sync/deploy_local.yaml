# The widget sync controller, deployed in the outer (primary) cluster.
# Exactly one replica: the proofs assume a single active sync controller.
# The Secret widget-sync-remote-kubeconfig holds a kubeconfig for the inner
# cluster (key "kubeconfig") and the bearer token it references through a
# relative tokenFile (key "token"); tools/two-cluster-test.sh creates it. Both
# keys land in the same mounted directory. kube re-reads the token file at
# least once a minute, so rotating the Secret takes effect without a restart.
# Readiness is the file the binary creates at $READY_FILE once the remote
# credential has passed its SelfSubjectAccessReview check (a denial makes the
# process exit instead, so the pod crash-loops and never becomes ready). There
# is no liveness probe: the binary exposes nothing that reflects whether the
# reconcilers are still making progress, and a probe that does not measure that
# would only restart a healthy pod.
#
# The ConfigMap widget-sync-janitor is the janitor's pause gate. It is mounted
# read-only at /etc/widget-sync/janitor and the binary is told, through
# JANITOR_PAUSE_FILE, to withhold every Delete while the file `pause` exists
# there. It ships empty, so the mount exists and nothing is paused; adding the
# key `pause` (any content) pauses within the kubelet's ConfigMap sync period,
# removing it resumes. See "Before restoring the outer cluster" in README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: widget-sync-janitor
  namespace: widget-sync
  labels:
    app.kubernetes.io/name: widget-sync-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-sync-controller
  namespace: widget-sync
  labels:
    app.kubernetes.io/name: widget-sync-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: widget-sync-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widget-sync-controller
    spec:
      # The in-cluster token is how the controller reaches the outer API server.
      automountServiceAccountToken: true
      # The image declares the same uid; it is repeated here so that
      # runAsNonRoot holds even for an image built without it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: local/widget-sync-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          name: controller
          env:
            - name: REMOTE_KUBECONFIG
              value: /etc/widget-sync/remote-kubeconfig/kubeconfig
            - name: READY_FILE
              value: /run/widget-sync/ready
            - name: JANITOR_PAUSE_FILE
              value: /etc/widget-sync/janitor/pause
          # A startup probe, not a readiness probe: the file appears once the
          # access check has passed and never disappears, so there is nothing
          # to re-check afterwards.
          startupProbe:
            exec:
              command:
                - test
                - -f
                - /run/widget-sync/ready
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: remote-kubeconfig
              mountPath: /etc/widget-sync/remote-kubeconfig
              readOnly: true
            # The janitor's pause gate: the file `pause` here withholds deletes.
            - name: janitor
              mountPath: /etc/widget-sync/janitor
              readOnly: true
            # The only writable path; it holds the ready file.
            - name: run
              mountPath: /run/widget-sync
      volumes:
        - name: remote-kubeconfig
          secret:
            secretName: widget-sync-remote-kubeconfig
        - name: janitor
          configMap:
            name: widget-sync-janitor
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      serviceAccountName: widget-sync-controller
