apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.anvil.dev
spec:
  group: anvil.dev
  names:
    categories: []
    kind: Widget
    plural: widgets
    shortNames:
    - wdg
    singular: widget
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WidgetSpec via `CustomResource`
        properties:
          spec:
            properties:
              clusterName:
                description: The name of the binding whose cluster receives the mirror. Immutable.
                type: string
                x-kubernetes-validations:
                - message: clusterName is immutable
                  rule: self == oldSelf
              count:
                format: int32
                type: integer
              message:
                nullable: true
                type: string
            required:
            - clusterName
            - count
            type: object
          status:
            description: The status of a Widget. On an inner copy it is written by the inner implementation; on an outer copy it is written by the sync controller, which mirrors the inner copy's data fields and combines its conditions with its own.
            nullable: true
            properties:
              conditions:
                description: On an outer copy, exactly Synced, Ready and Stalled, all with observedGeneration equal to the generation the sync controller reconciled. Synced is True when the spec is in the inner cluster and the inner status observes it; otherwise False with reason InnerConverging, InnerTerminating, StaleMirror, ForeignObject, or, after a failed request, Forbidden, InnerUnreachable, CreateFailed, Rejected or RequestFailed. Ready is True exactly when Synced is True and the inner copy's own Ready condition, if present, is True and its own Stalled condition, if present, is not True; otherwise False, with reason NotSynced when not synced, else with the inner condition's reason and message. Stalled is True when the sync controller is in a permanent case (ForeignObject, Forbidden, Rejected) or the inner copy's own Stalled condition is True, with the sync controller's reason when it has one, else the inner condition's. Ready and Stalled are never both True.
                items:
                  description: A condition in the usual metav1.Condition shape. `lastTransitionTime` is omitted because the verified controller does not read clocks.
                  properties:
                    message:
                      description: Free text; on an outer copy, copied from the inner condition when the reason is.
                      nullable: true
                      type: string
                    observedGeneration:
                      description: The generation of the object the condition was computed for.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: A CamelCase word saying why the condition has its status.
                      nullable: true
                      type: string
                    status:
                      description: True or False.
                      type: string
                    type:
                      description: Synced, Ready or Stalled on an outer copy; whatever the inner implementation reports on an inner copy (the sync controller reads Ready and Stalled).
                      type: string
                  required:
                  - status
                  - type
                  type: object
                nullable: true
                type: array
              observedCount:
                description: Mirrored from the inner copy while Synced is True; otherwise kept as last reported.
                format: int32
                nullable: true
                type: integer
              observedGeneration:
                description: The generation of this object that the writer of this status last processed. On an outer copy the sync controller stamps the generation it reconciled on every write, including the ones that report a failure.
                format: int64
                nullable: true
                type: integer
              ready:
                description: Mirrored from the inner copy while Synced is True; otherwise kept as last reported.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: Widget
        type: object
    served: true
    storage: true
    subresources:
      status: {}

