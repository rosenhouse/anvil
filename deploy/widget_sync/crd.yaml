apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.anvil.dev
spec:
  group: anvil.dev
  names:
    categories: []
    kind: Widget
    plural: widgets
    shortNames:
    - wdg
    singular: widget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Stalled")].status
      name: Stalled
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Synced")].reason
      name: Synced-Reason
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Ready-Reason
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Stalled")].reason
      name: Stalled-Reason
      priority: 1
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WidgetSpec via `CustomResource`
        properties:
          spec:
            properties:
              clusterName:
                description: The name of the binding whose cluster receives the mirror. Immutable.
                type: string
                x-kubernetes-validations:
                - message: clusterName is immutable
                  rule: self == oldSelf
              count:
                format: int32
                type: integer
              message:
                nullable: true
                type: string
            required:
            - clusterName
            - count
            type: object
          status:
            description: The status of a Widget. On an inner copy it is written by the inner implementation; on an outer copy it is written by the sync controller, which mirrors the inner copy's data fields and combines its conditions with its own.
            nullable: true
            properties:
              conditions:
                description: 'On an outer copy: Synced, Ready and Stalled first, all with observedGeneration equal to the generation the sync controller reconciled; then the inner copy''s conditions of other types, in the inner order, the first of each type, with status, reason and message as the inner copy wrote them and observedGeneration equal to the outer generation at which it was read (while Synced is False they are kept as last reported, with the stamp they were read at). An inner Synced condition is dropped. No condition carries lastTransitionTime. The rules: doc/widget_sync_design.md, section 1.4. Synced is True when the spec is in the inner cluster and the inner status observes it; otherwise False with the reason of the case, which deploy/widget_sync/README.md tabulates with the Ready and Stalled each one reads. While Synced is True, Ready is the inner copy''s own Ready condition (status, reason and message; an inner status that is none of True, False and Unknown reads Unknown), except that an inner Stalled=True forces Ready=False with that condition''s reason and message, and a mirror with no Ready condition reads Unknown with reason NoInnerReadyCondition. While Synced is False, Ready has reason NotSynced, and is Unknown where the controller has no caught-up inner status for the current spec and False where it knows no mirror runs that spec. Stalled is True with the sync controller''s reason in a case nothing the controller does again gets out of; otherwise, while Synced is True, it is the inner copy''s own Stalled condition, and False with Synced''s reason when the inner copy has no Stalled condition or Synced is False. Ready and Stalled are never both True.'
                items:
                  description: A condition in the usual metav1.Condition shape. `lastTransitionTime` is omitted because the verified controller does not read clocks.
                  properties:
                    message:
                      description: Free text; on an outer copy, copied from the inner condition when the reason is.
                      nullable: true
                      type: string
                    observedGeneration:
                      description: The generation of the object the condition was computed for.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: A CamelCase word saying why the condition has its status; absent on an outer copy when the inner condition it repeats carries none.
                      nullable: true
                      type: string
                    status:
                      description: 'On an outer copy: Synced is True or False; Ready and Stalled are True, False or Unknown; a copied condition''s status is the inner copy''s, as written. On an inner copy, whatever the inner implementation writes.'
                      type: string
                    type:
                      description: 'On an outer copy: Synced, Ready or Stalled, or a type copied from the inner copy. On an inner copy: whatever the inner implementation reports; the sync controller merges Ready and Stalled, drops Synced, and copies the rest.'
                      type: string
                  required:
                  - status
                  - type
                  type: object
                nullable: true
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedCount:
                description: Mirrored from the inner copy while Synced is True; otherwise kept as last reported.
                format: int32
                nullable: true
                type: integer
              observedGeneration:
                description: The generation of this object that the writer of this status last processed. On an outer copy the sync controller stamps the generation it reconciled on every write, including the ones that report a failure.
                format: int64
                nullable: true
                type: integer
              ready:
                description: 'Mirrored from the inner copy while Synced is True; otherwise kept as last reported. A data field, not the Ready condition: while Synced is False the two can disagree.'
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: Widget
        type: object
    served: true
    storage: true
    subresources:
      status: {}
