# The widget echo controller, deployed in the inner (remote) cluster as the
# demo's stand-in for a real Widget implementation. It writes Widget status
# (observedGeneration, ready, observedCount, a Ready condition) and nothing else.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: widget-echo
  name: widget-echo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-echo-controller
  namespace: widget-echo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: widget-echo-controller
  name: widget-echo-controller-role
rules:
  - apiGroups:
      - anvil.dev
    resources:
      - widgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - anvil.dev
    resources:
      - widgets/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-echo-controller
  name: widget-echo-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: widget-echo-controller-role
subjects:
  - kind: ServiceAccount
    name: widget-echo-controller
    namespace: widget-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-echo-controller
  namespace: widget-echo
  labels:
    app.kubernetes.io/name: widget-echo-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: widget-echo-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widget-echo-controller
    spec:
      containers:
        - image: local/widget-echo-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          name: controller
          env:
            # Seconds the echo controller waits before writing status; raise it in a
            # live demo to watch the outer copy's Synced condition pass through
            # InnerConverging.
            - name: WIDGET_ECHO_DELAY_SECONDS
              value: "0"
      serviceAccountName: widget-echo-controller
