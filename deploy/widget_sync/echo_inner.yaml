# The widget echo controller, deployed in the inner (remote) cluster as the
# demo's stand-in for a real implementation of the demo kinds. For each kind
# it is given it writes status (observedGeneration, a Ready condition, and the
# kind's own echo of its spec) and nothing else. Adding a kind here means one
# more --kind argument and its two RBAC rules; the CRD must be installed first.
# No probes: the binary exposes no health endpoint.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: widget-echo
  name: widget-echo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-echo-controller
  namespace: widget-echo
# Only the controller pod opts in to the token, below.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: widget-echo-controller
  name: widget-echo-controller-role
rules:
  - apiGroups:
      - anvil.dev
    resources:
      - widgets
      - gadgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - anvil.dev
    resources:
      - widgets/status
      - gadgets/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-echo-controller
  name: widget-echo-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: widget-echo-controller-role
subjects:
  - kind: ServiceAccount
    name: widget-echo-controller
    namespace: widget-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-echo-controller
  namespace: widget-echo
  labels:
    app.kubernetes.io/name: widget-echo-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: widget-echo-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widget-echo-controller
    spec:
      # The in-cluster token is how the controller reaches the API server.
      automountServiceAccountToken: true
      # The image declares the same uid; it is repeated here so that
      # runAsNonRoot holds even for an image built without it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: local/widget-echo-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          name: controller
          # The image's entrypoint is `controller run`; these follow it.
          args:
            - --kind
            - anvil.dev/v1/Widget
            - --kind
            - anvil.dev/v1/Gadget
          env:
            # Seconds the echo controller waits before writing status; raise it in a
            # live demo to watch the outer copy's Synced condition pass through
            # InnerConverging.
            - name: WIDGET_ECHO_DELAY_SECONDS
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      serviceAccountName: widget-echo-controller
