# RBAC for the widget sync controller in the outer (primary) cluster.
# One pair of rules per configured kind (deploy_local.yaml's --kind flags):
# `<plural>` get, list, watch and `<plural>/status` patch, as
# doc/widget_sync_fanout_design.md, section 4, prescribes. The demo configures
# Widget and Gadget.
# The controller reads them and writes only their status subresource here;
# its access to the inner cluster comes from the kubeconfig in the
# widget-sync-remote-kubeconfig Secret (see rbac_inner.yaml).
# The Role in namespace default at the end is what the crash-testing mode
# (`controller crash`, src/shim_layer/fault_injection.rs) needs: it gets and
# replaces the one ConfigMap default/fault-injection-config through the primary
# client, so the grant is get and update on that name only. `run` mode never
# uses it. Not granted: events (the controller emits none).
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: widget-sync
  name: widget-sync
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-sync-controller
  namespace: widget-sync
# Only the controller pod (deploy_local.yaml) opts in to the token.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-role
rules:
  - apiGroups:
      - anvil.dev
    resources:
      - widgets
      - gadgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - anvil.dev
    resources:
      - widgets/status
      - gadgets/status
    verbs:
      - patch
  # The boot shape check reads each configured kind's CRD
  # (doc/widget_sync_fanout_design.md, sections 2.2 and 4). Read-only, and only
  # get: the CRDs are fetched by name, never listed or watched.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: widget-sync-controller-role
subjects:
  - kind: ServiceAccount
    name: widget-sync-controller
    namespace: widget-sync
---
# Crash-testing mode only; see the header. resourceNames limits get and update
# to the named ConfigMap (neither verb lists, so no wider rule is needed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-fault-injection
  namespace: default
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - fault-injection-config
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-fault-injection
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: widget-sync-controller-fault-injection
subjects:
  - kind: ServiceAccount
    name: widget-sync-controller
    namespace: widget-sync
