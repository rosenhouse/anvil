# RBAC for the widget sync controller in the outer (primary) cluster.
# The controller reads Widgets and writes only their status subresource here;
# its access to the inner cluster comes from the kubeconfig in the
# widget-sync-remote-kubeconfig Secret (see rbac_inner.yaml).
# Not granted here, on purpose:
# - configmaps get,update in namespace default: needed only by the crash
#   testing mode (`controller crash`, src/shim_layer/fault_injection.rs), which
#   reads and replaces default/fault-injection-config through the primary
#   client. There is no crash-testing manifest for this controller; one would
#   add a Role/RoleBinding in default for the widget-sync-controller account.
# - events: the controller emits none.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: widget-sync
  name: widget-sync
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-sync-controller
  namespace: widget-sync
# Only the controller pod (deploy_local.yaml) opts in to the token.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-role
rules:
  - apiGroups:
      - anvil.dev
    resources:
      - widgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - anvil.dev
    resources:
      - widgets/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: widget-sync-controller-role
subjects:
  - kind: ServiceAccount
    name: widget-sync-controller
    namespace: widget-sync
