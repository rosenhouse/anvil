# RBAC for the widget sync controller in the outer (primary) cluster.
# The controller reads Widgets and writes only their status subresource here;
# its access to an inner cluster comes from the kubeconfig in that binding's
# Secret `<clusterName>-kubeconfig` (see rbac_inner.yaml for what the credential
# in it must be allowed to do).
# Beyond the kinds it is configured with, it reads:
#   - secrets, in every namespace: the binding manager watches the ones named
#     `*-kubeconfig` and builds a binding's clients from them
#     (doc/widget_sync_fanout_design.md, sections 1.2 and 4). This is a wide
#     grant, and it is the point: bindings live in any namespace.
#   - customresourcedefinitions, get: the boot shape check of each configured
#     kind (section 2.2);
#   - namespaces, get on kube-system only: its uid is the outer cluster id the
#     claim of each inner cluster records (section 1.3).
# The Role in namespace default at the end is what the crash-testing mode
# (`controller crash`, src/shim_layer/fault_injection.rs) needs: it gets and
# replaces the one ConfigMap default/fault-injection-config through the primary
# client, so the grant is get and update on that name only. `run` mode never
# uses it. Not granted: events (the controller emits none).
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: widget-sync
  name: widget-sync
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: widget-sync-controller
  namespace: widget-sync
# Only the controller pod (deploy_local.yaml) opts in to the token.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-role
rules:
  # One pair of rules per configured kind. The second demo kind, Gadget, is
  # added here with the kinds work (issue #41).
  - apiGroups:
      - anvil.dev
    resources:
      - widgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - anvil.dev
    resources:
      - widgets/status
    verbs:
      - patch
  # The bindings: the manager watches every namespace for `*-kubeconfig`.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # The boot shape check of each configured kind.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
  # The outer cluster id: the uid of this one namespace, nothing else.
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - kube-system
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: widget-sync-controller-role
subjects:
  - kind: ServiceAccount
    name: widget-sync-controller
    namespace: widget-sync
---
# Crash-testing mode only; see the header. resourceNames limits get and update
# to the named ConfigMap (neither verb lists, so no wider rule is needed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-fault-injection
  namespace: default
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - fault-injection-config
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: widget-sync-controller
  name: widget-sync-controller-fault-injection
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: widget-sync-controller-fault-injection
subjects:
  - kind: ServiceAccount
    name: widget-sync-controller
    namespace: widget-sync
